<script>
/* Pick the person from the URL: /ag-solutions/mohamed  (or ?p=mohamed when previewing locally).
   Done here, before the body is drawn, so another person's details never flash. */
const SLUG = (new URLSearchParams(location.search).get("p")
  || location.pathname.split("/").filter(Boolean).pop() || "").toLowerCase();
const CONFIG = PEOPLE[SLUG] || PEOPLE[DEFAULT_PERSON];
if (CONFIG.avatar) document.head.appendChild(Object.assign(document.createElement("link"), { rel: "preload", as: "image", href: CONFIG.avatar }));
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --bg: #0b0b0c;
    --ink: #f3ead7;
    --muted: #bfae86;
    --gold: #d9b56a;
    --gold-grad: linear-gradient(135deg, #8a6a2f 0%, #e9cf8a 32%, #b8913f 52%, #f6e3a8 74%, #9c7633 100%);
    --line: rgba(212, 175, 95, .22);
    --col: 430px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100svh;
    background:
      radial-gradient(70% 45% at 50% 0%, rgba(60, 50, 30, .35), transparent 70%),
      radial-gradient(60% 40% at 50% 100%, rgba(50, 40, 20, .3), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: "Cairo", system-ui, sans-serif;
    overflow-x: clip;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  #mesh { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: var(--col);
    margin: 0 auto;
    min-height: 100svh;
    display: flex; flex-direction: column; align-items: center;
    padding: max(36px, env(safe-area-inset-top)) 0 0;
    visibility: hidden;         /* shown once the person's details are filled in */
  }
  .ready .card { visibility: visible; }

  /* ── Brand header ─────────────────────────────── */
  .brand { display: flex; flex-direction: column; align-items: center; width: calc(100% - 48px); }
  .brand .icon { width: 118px; height: auto; filter: drop-shadow(0 4px 14px rgba(0, 0, 0, .6)); }
  .brand .org { width: 100%; max-width: 360px; height: auto; margin-top: 10px; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .7)); }
  .brand .reg { margin-top: 6px; font-size: 15px; font-weight: 600; color: #e6dcc6; letter-spacing: .01em; }
  .rule {
    width: calc(100% - 64px); height: 1px; margin-top: 16px;
    background: linear-gradient(90deg, transparent, var(--gold) 20%, #f6e3a8 50%, var(--gold) 80%, transparent);
    opacity: .8;
  }

  /* ── Portrait in a double gold frame ──────────── */
  .frame {
    margin-top: 26px; padding: 4px;
    background: var(--gold-grad);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 18px 40px rgba(0, 0, 0, .65), 0 0 28px rgba(217, 181, 106, .18);
  }
  .frame-inner { padding: 7px; background: #111; }
  .frame-photo { padding: 2px; background: var(--gold-grad); }
  .frame img { display: block; width: 188px; aspect-ratio: 4 / 5; object-fit: cover; background: #ddd; }

  /* ── Identity ─────────────────────────────────── */
  .name {
    margin-top: 22px;
    font-size: clamp(30px, 9.4vw, 40px); font-weight: 800; line-height: 1.25;
    text-align: center; max-width: calc(100% - 32px);
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .7));
  }
  .name span { display: block; white-space: nowrap; }
  .title {
    margin-top: 14px; padding: 6px 34px 8px;
    border-radius: 10px;
    background: var(--gold-grad); color: #1a140a;
    font-size: 19px; font-weight: 800;
    box-shadow: inset 0 1px 0 rgba(255, 250, 225, .6), inset 0 -2px 0 rgba(90, 65, 20, .45), 0 6px 16px rgba(0, 0, 0, .55);
  }
  .member { margin-top: 12px; font-size: 16px; font-weight: 600; color: #e6dcc6; }
  .member b { margin-inline-start: 6px; font-weight: 800; color: var(--gold); letter-spacing: .04em; }

  /* ── Contact rows ─────────────────────────────── */
  .contacts { list-style: none; width: calc(100% - 56px); margin-top: 26px; border-top: 1px solid var(--line); }
  .contacts li { border-bottom: 1px solid var(--line); }
  .contacts a {
    display: flex; align-items: center; gap: 18px;
    height: 64px; padding: 0 2px;
    transition: background-color .2s ease;
  }
  .contacts a:active { background: rgba(217, 181, 106, .07); }
  .contacts .text { flex: 1; min-width: 0; font-size: 18px; font-weight: 400; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contacts .arrow { width: 22px; height: 22px; color: var(--gold); flex: none; transition: transform .2s ease; }
  @media (hover: hover) { .contacts a:hover .arrow { transform: translate(-2px, -2px); } }

  .ring {
    flex: none; display: grid; place-items: center;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--gold); color: var(--gold);
    background: radial-gradient(circle at 35% 30%, rgba(246, 227, 168, .12), rgba(0, 0, 0, .2) 70%);
    box-shadow: 0 0 10px rgba(217, 181, 106, .18), inset 0 0 6px rgba(217, 181, 106, .14);
  }
  .ring svg { width: 22px; height: 22px; }

  /* ── Socials ─────────────────────────────────── */
  .socials { display: flex; gap: 24px; margin-top: 22px; }
  .socials .ring { width: 48px; height: 48px; transition: box-shadow .2s ease, transform .2s ease; }
  .socials .ring svg { width: 25px; height: 25px; }
  @media (hover: hover) { .socials .ring:hover { transform: translateY(-2px); box-shadow: 0 0 18px rgba(217, 181, 106, .45); } }

  /* ── Save contact ────────────────────────────── */
  .save {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: calc(100% - 56px); height: 56px; margin-top: 28px;
    border: 1.5px solid var(--gold); border-radius: 12px;
    background: linear-gradient(180deg, rgba(217, 181, 106, .16), rgba(217, 181, 106, .06));
    color: var(--ink);
    font: 600 18px/1 "Cairo", system-ui, sans-serif;
    box-shadow: 0 0 14px rgba(217, 181, 106, .2), inset 0 1px 0 rgba(246, 227, 168, .2);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background-color .2s ease, box-shadow .2s ease, transform .1s ease;
  }
  .save svg { width: 23px; height: 23px; color: var(--gold); flex: none; }
  .save:active { transform: scale(.98); background: rgba(217, 181, 106, .2); }
  @media (hover: hover) { .save:hover { box-shadow: 0 0 22px rgba(217, 181, 106, .4), inset 0 1px 0 rgba(246, 227, 168, .3); } }

  /* ── Footer strip ────────────────────────────── */
  .foot {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    width: 100%; margin-top: auto;
    padding: 40px 0 max(26px, env(safe-area-inset-bottom));
  }
  .foot::before, .foot::after { content: ""; flex: 1; max-width: 70px; height: 1px; background: linear-gradient(90deg, transparent, var(--line), var(--gold)); }
  .foot::after { transform: scaleX(-1); }
  .foot .chip { width: 22px; height: 22px; color: var(--gold); opacity: .85; }
  .foot .maker { direction: ltr; font-size: 13px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .save, .ring, .contacts .arrow { transition: none; } }
</style>
</head>
<body>
<canvas id="mesh" aria-hidden="true"></canvas>

<main class="card">
  <header class="brand">
    <img class="icon" src="assets/logo-icon.webp" alt="" width="366" height="306">
    <img class="org" src="assets/logo-name.webp" alt="جمعية العاملين بالعقارات بالسادات" width="902" height="144">
    <p class="reg">المشهرة برقم 2226 لسنة 2024</p>
  </header>
  <div class="rule" aria-hidden="true"></div>

  <div class="frame"><div class="frame-inner"><div class="frame-photo"><img alt="" data-field="avatar"></div></div></div>

  <h1 class="name" data-field="name"></h1>
  <p class="title" data-field="title"></p>
  <p class="member">رقم العضوية <b dir="ltr" data-field="membership"></b></p>

  <ul class="contacts">
    <li><a data-link="phone" href="#">
      <span class="ring"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span>
      <span class="text" dir="ltr" data-field="phoneLabel"></span>

      <span class="text" dir="ltr" data-field="email"></span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 19 5 5M16 5H5v11"/></svg>
    </a></li>

      <span class="text" dir="ltr" data-field="websiteLabel"></span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 19 5 5M16 5H5v11"/></svg>
    </a></li>
  </ul>

  <nav class="socials" aria-label="حسابات التواصل">
    <a class="ring" data-link="whatsapp" href="#" target="_blank" rel="noopener" aria-label="واتساب">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.98L2 22l5.17-1.5A9.9 9.9 0 1 0 12.04 2zm0 18.1a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.07.89.9-3-.2-.31a8.2 8.2 0 1 1 6.85 3.75zm4.5-6.14c-.25-.12-1.47-.72-1.7-.8-.23-.09-.39-.13-.56.12-.16.25-.64.8-.78.97-.15.16-.29.18-.54.06a6.7 6.7 0 0 1-3.34-2.92c-.25-.43.25-.4.72-1.34.08-.16.04-.3-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.41-.56-.42h-.47a.9.9 0 0 0-.66.31 2.77 2.77 0 0 0-.86 2.06 4.8 4.8 0 0 0 1 2.55c.12.16 1.73 2.64 4.2 3.7 1.56.68 2.17.73 2.95.62.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.08.15-1.18-.06-.11-.23-.17-.48-.29z"/></svg>
    </a>
    <a class="ring" data-link="facebook" href="#" target="_blank" rel="noopener" aria-label="فيسبوك">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.6 22v-8.2h2.8l.42-3.2H13.6V8.56c0-.93.26-1.56 1.6-1.56h1.7V4.14A23 23 0 0 0 14.4 4c-2.47 0-4.16 1.5-4.16 4.27v2.36H7.45v3.2h2.79V22z"/></svg>
    </a>
    <a class="ring" data-link="instagram" href="#" target="_blank" rel="noopener" aria-label="إنستجرام">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".9" fill="currentColor" stroke="none"/></svg>
    </a>
  </nav>

  <button class="save" type="button" id="save-contact">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="8" r="4"/><path d="M22 21a7 7 0 0 0-14 0M5 8v6M2 11h6"/></svg>
    حفظ جهة الاتصال
  </button>

  <footer class="foot">
    <svg class="chip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8.5 7.5a6 6 0 0 1 0 9M12 5a9.5 9.5 0 0 1 0 14M15.5 2.5a13 13 0 0 1 0 19"/></svg>
    <span class="maker">AG Solutions</span>
  </footer>
</main>

<script>
(() => {
  const C = CONFIG;
  document.querySelectorAll("[data-field]").forEach((el) => {
    const v = C[el.dataset.field];
    if (el.tagName === "IMG") { if (v) el.src = v; return; }
    if (!v) { el.remove(); return; }
    el.textContent = v;
  });
  if (!C.membership) document.querySelector(".member")?.remove();
  const nameEl = document.querySelector(".name");
  if (nameEl) {
    document.title = `${C.name} · ${ORG}`;
    document.querySelector(".frame img").alt = `صورة ${C.name}`;
    // Show the name on the lines given in people.js, each kept on one line:
    // shrink the font until the widest line fits the column.
    const lines = C.nameLines && C.nameLines.length ? C.nameLines : [C.name];
    nameEl.replaceChildren(...lines.map((t) => Object.assign(document.createElement("span"), { textContent: t })));
    const fitName = () => {
      nameEl.style.fontSize = "";
      const size = parseFloat(getComputedStyle(nameEl).fontSize);
      const widest = Math.max(...[...nameEl.children].map((s) => s.scrollWidth));
      const ratio = nameEl.clientWidth / widest;
      if (ratio < 1) nameEl.style.fontSize = `${Math.floor(size * ratio)}px`;
    };
    fitName();
    document.fonts.ready.then(fitName);
    addEventListener("resize", fitName);
  }
  document.querySelectorAll("[data-link]").forEach((el) => {
    const key = el.dataset.link;
    const v = C[key];
    if (!v) { (el.closest("li") || el).remove(); return; }
    el.href = key === "phone" ? `tel:${v.replace(/[^\d+]/g, "")}`
      : key === "email" ? `mailto:${v}`
      : key === "whatsapp" ? `https://wa.me/${v.replace(/\D/g, "")}` : v;
  });
  const contacts = document.querySelector(".contacts");
  if (contacts && !contacts.children.length) contacts.remove();
  const socials = document.querySelector(".socials");
  if (socials && !socials.children.length) socials.remove();
  document.querySelector('meta[name="description"]').content =
    `${C.name}${C.title ? " — " + C.title : ""} · ${ORG}`;
  document.documentElement.classList.add("ready");

  /* Save contact: a vCard 3.0 file (the version both iOS and Android read fully).
     The photo is re-encoded as JPEG because iOS Contacts ignores WebP. It is
     prepared on load so the tap can start the download straight away. */
  const esc = (s) => String(s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  const fold = (line) => line.length <= 75 ? line : line.match(/.{1,74}/g).join("\r\n ");
  let photo = "";
  function vcard() {
    // Arabic names: the first word is the given name, the rest is the family name.
    const parts = (C.name || "").trim().split(/\s+/);
    const first = parts.shift() || "";
    const lines = [
      "BEGIN:VCARD", "VERSION:3.0",
      `N:${esc(parts.join(" "))};${esc(first)};;;`,
      `FN:${esc(C.name || "")}`,
      `ORG:${esc(ORG)}`,
    ];
    if (C.title) lines.push(`TITLE:${esc(C.title)}`);
    if (C.membership) lines.push(`NOTE:${esc(`رقم العضوية ${C.membership}`)}`);
    if (C.phone) lines.push(`TEL;TYPE=CELL,VOICE:${C.phone.replace(/[^\d+]/g, "")}`);
    if (C.whatsapp && C.whatsapp.replace(/\D/g, "") !== (C.phone || "").replace(/\D/g, ""))
      lines.push(`item9.TEL:${C.whatsapp.replace(/[^\d+]/g, "")}`, "item9.X-ABLabel:WhatsApp");
    if (C.email) lines.push(`EMAIL;TYPE=INTERNET,WORK:${C.email}`);
    if (C.website) lines.push(`URL;TYPE=WORK:${C.website}`);
    [["facebook", "Facebook"], ["instagram", "Instagram"]].forEach(([k, label], i) => {
      if (!C[k]) return;
      lines.push(`item${i + 1}.URL:${C[k]}`, `item${i + 1}.X-ABLabel:${label}`,
        `X-SOCIALPROFILE;TYPE=${k}:${C[k]}`);
    });
    if (photo) lines.push(`PHOTO;ENCODING=b;TYPE=JPEG:${photo}`);
    lines.push("END:VCARD");
    return lines.map(fold).join("\r\n") + "\r\n";
  }
  if (C.avatar) {
    const img = new Image();
    img.onload = () => {
      try {
        const size = 400, cv = document.createElement("canvas");
        const s = Math.min(img.naturalWidth, img.naturalHeight);
        cv.width = cv.height = size;
        // square crop, biased to the top so the face stays in frame
        cv.getContext("2d").drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) * 0.25, s, s, 0, 0, size, size);
        photo = cv.toDataURL("image/jpeg", 0.85).split(",")[1];
      } catch { /* e.g. opened from file:// — save without the photo */ }
    };
    img.src = C.avatar;
  }
  document.getElementById("save-contact").addEventListener("click", () => {
    const file = `${(C.name || "contact").replace(/[\\/:*?"<>|\s]+/g, "_")}.vcf`;
    const url = URL.createObjectURL(new Blob([vcard()], { type: "text/vcard;charset=utf-8" }));
    const a = Object.assign(document.createElement("a"), { href: url, download: file });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  });

  /* Faceted gold mesh (the card's background): jittered grid points joined
     into triangles, fixed seed so it looks the same on every load. A soft
     light drifts slowly across it and brightens the lines it passes. */
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cv = document.getElementById("mesh");
  const ctx = cv.getContext("2d");
  let edges = [], w = 0, h = 0;
  function build() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    const cell = 110, cols = Math.ceil(w / cell) + 2, rows = Math.ceil(h / cell) + 2;
    const P = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++)
      P.push([(i - 0.5 + (rnd() - 0.5) * 0.9) * cell, (j - 0.5 + (rnd() - 0.5) * 0.9) * cell]);
    const at = (i, j) => P[j * cols + i];
    edges = [];
    const add = (a, b) => edges.push({ a, b, k: rnd() < 0.12 ? 0.55 + rnd() * 0.3 : 0.1 + rnd() * 0.14 });
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      if (i + 1 < cols) add(at(i, j), at(i + 1, j));
      if (j + 1 < rows) add(at(i, j), at(i, j + 1));
      if (i + 1 < cols && j + 1 < rows) rnd() < 0.5 ? add(at(i, j), at(i + 1, j + 1)) : add(at(i + 1, j), at(i, j + 1));
    }
  }
  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    const lx = w * (0.5 + 0.45 * Math.sin(t * 0.00011)), ly = h * (0.4 + 0.35 * Math.cos(t * 0.00007));
    const reach = Math.max(w, h) * 0.55;
    ctx.lineWidth = 1;
    for (const e of edges) {
      const mx = (e.a[0] + e.b[0]) / 2, my = (e.a[1] + e.b[1]) / 2;
      const lit = Math.max(0, 1 - Math.hypot(mx - lx, my - ly) / reach);
      const a = e.k * (0.35 + 0.9 * lit);
      ctx.strokeStyle = `rgba(214,176,98,${Math.min(a, 0.85).toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(e.a[0], e.a[1]); ctx.lineTo(e.b[0], e.b[1]); ctx.stroke();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  build(); requestAnimationFrame(draw);
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { build(); if (reduce) draw(0); }, 150); });
})();
</script>
